[package]
name = "magpie"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "A unified Wikimedia Commons transfer tool (Flickr2Commons, Url2Commons, Geograph2Commons, CommonsHelper)"
repository = "https://github.com/magnusmanske/magpie"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-private"] }
clap = { version = "4", features = ["derive", "env"] }
include_dir = "0.7"
mediawiki_upload = { version = "0.1", features = ["wikimedia"] }
mime_guess = "2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", features = ["form", "json", "multipart", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc", features = [
    "format",
    "http",
    "logging",
    "oauth1",
    "replicas",
    "server",
    "ssrf",
    "telemetry",
    "web",
    "wiki",
    "wiki-api",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
